name: CI

on:
  push:
    branches: ["main", "Development"]
  pull_request:
    branches: ["main", "Development"]

jobs:
  # The cross-platform solution (Core, Presentation, Avalonia) on Linux, with the coverage gate.
  linux:
    runs-on: ubuntu-latest
    # The actual .slnx/.csproj files live under Paarde/ rather than the repo root.
    defaults:
      run:
        working-directory: Paarde

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Paarde/ holds two solutions, so each command names one. Paarde.slnx leaves out the
      # Windows-only WinUI projects.
      - name: Restore
        run: dotnet restore Paarde.slnx

      - name: Build
        run: dotnet build Paarde.slnx --no-restore --configuration Release

      # Run one test project per `dotnet test` invocation rather than the whole .slnx at once.
      # `dotnet test` against a solution runs each project's tests concurrently as separate
      # testhost processes - on this runner's limited cores, that starves Porta.Pty's native PTY
      # exit-notification thread (PtyProcessManagerTests) long enough to intermittently lose/delay
      # it, timing the test out. Each project gets its own results folder so the coverage gate
      # knows which report is which.
      - name: Test Paarde.Core.Tests with coverage
        run: >
          dotnet test Paarde.Core.Tests/Paarde.Core.Tests.csproj --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage/Paarde.Core.Tests

      - name: Test Paarde.Presentation.Tests with coverage
        run: >
          dotnet test Paarde.Presentation.Tests/Paarde.Presentation.Tests.csproj --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage/Paarde.Presentation.Tests

      - name: Test Paarde.Avalonia.Tests
        run: dotnet test Paarde.Avalonia.Tests/Paarde.Avalonia.Tests.csproj --no-build --configuration Release

      # Each floor is checked against the line coverage of the project's own assembly, not the
      # report's total (which also counts referenced assemblies). Floors sit a few points below
      # the 2026-11-10 baseline (Core ~86%, Presentation ~81%) so the gate catches real
      # regressions; raise them as coverage improves rather than loosening them. Paarde.Avalonia
      # has no floor: since Epic 30 moved its logic into Paarde.Presentation, it is views and
      # code-behind, which these unit tests aren't meant to cover.
      - name: Enforce coverage floor
        shell: python3 {0}
        run: |
          import glob, re, sys

          floors = {"Paarde.Core": 83, "Paarde.Presentation": 77}
          failed = False

          for assembly, floor in floors.items():
              reports = glob.glob(f"coverage/{assembly}.Tests/*/coverage.cobertura.xml")
              if not reports:
                  print(f"::error::No coverage report found for {assembly}.Tests")
                  failed = True
                  continue

              text = open(reports[0], encoding="utf-8").read()
              match = re.search(rf'<package name="{re.escape(assembly)}" line-rate="([0-9.]+)"', text)
              if not match:
                  print(f"::error::{assembly} is missing from its coverage report")
                  failed = True
                  continue

              pct = float(match.group(1)) * 100
              print(f"{assembly} line coverage: {pct:.2f}% (floor: {floor}%)")
              if pct < floor:
                  print(f"::error::{assembly} coverage {pct:.2f}% is below the {floor}% floor")
                  failed = True

          sys.exit(1 if failed else 0)

  # Everything, including the WinUI 3 front end, on Windows - the only place Paarde.WinUI builds,
  # and the platform where the PTY, process-kill and cmd.exe code paths differ most.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Paarde

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Paarde.Windows.slnx

      # Also downloads Monaco from the npm registry (checked against its SHA-512) for Paarde.WinUI.
      - name: Build
        run: dotnet build Paarde.Windows.slnx --no-restore --configuration Release

      # Paarde.WinUI.UiTests is left out: it drives the real app through UI Automation and sends
      # keys, so it needs an interactive desktop nobody else is using. Run it locally.
      - name: Test Paarde.Core.Tests
        run: dotnet test Paarde.Core.Tests/Paarde.Core.Tests.csproj --no-build --configuration Release

      - name: Test Paarde.Presentation.Tests
        run: dotnet test Paarde.Presentation.Tests/Paarde.Presentation.Tests.csproj --no-build --configuration Release

      - name: Test Paarde.Avalonia.Tests
        run: dotnet test Paarde.Avalonia.Tests/Paarde.Avalonia.Tests.csproj --no-build --configuration Release
