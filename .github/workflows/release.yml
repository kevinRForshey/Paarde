name: Release

on:
  push:
    tags:
      - "v*"

# Self-contained, single-file publishes for all four target platforms are built from one
# ubuntu-latest host (no macOS/Windows runners needed) - .NET resolves each RID's runtime pack from
# NuGet regardless of the build host, so cross-publishing works the same as a native build. This
# produces unsigned binaries; macOS Gatekeeper/Windows SmartScreen will warn on first launch since
# nothing here is code-signed/notarized - acceptable for now, revisit if that becomes a problem.
jobs:
  publish:
    runs-on: ubuntu-latest
    # The actual .slnx/.csproj files live under Paarde/ rather than the repo root. Archive output
    # paths below use $GITHUB_WORKSPACE explicitly so they still land at the repo root regardless.
    defaults:
      run:
        working-directory: Paarde
    strategy:
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish Paarde.Avalonia -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "$GITHUB_WORKSPACE/Paarde-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip" .

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf "$GITHUB_WORKSPACE/Paarde-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: Paarde-${{ matrix.rid }}
          path: Paarde-${{ steps.version.outputs.version }}-${{ matrix.rid }}.*

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # scripts/release.sh annotates the tag with a "## Changelog" body (commit subjects since the
      # previous tag) - pull that back out here so it becomes the release notes.
      - name: Extract changelog from tag
        run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > changelog.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --notes-file changelog.md
